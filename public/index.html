<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrackEdu — Student Attendance Management System</title>
  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0" />

  <style>
    :root {
      --primary: #1E3A8A;
      --on-primary: #FFFFFF;
      --primary-container: #2563EB;
      --on-primary-container: #DBEAFE;
      --secondary: #0D9488;
      --on-secondary: #FFFFFF;
      --secondary-container: #CCFBF1;
      --on-secondary-container: #115E59;
      --tertiary: #2563EB;
      --background: #F8FAFC;
      --on-background: #0F172A;
      --surface: #FFFFFF;
      --on-surface: #0F172A;
      --surface-variant: #F1F5F9;
      --on-surface-variant: #475569;
      --surface-lowest: #FFFFFF;
      --surface-low: #F8FAFC;
      --surface-card: #FFFFFF;
      --surface-container: #F1F5F9;
      --surface-high: #E2E8F0;
      --outline: #64748B;
      --outline-variant: #CBD5E1;

      --present-green: #16A34A;
      --present-bg: #DCFCE7;
      --present-text: #14532D;

      --absent-red: #DC2626;
      --absent-bg: #FFDAD6;
      --absent-text: #93000A;

      --warning-amber: #D97706;
      --warning-bg: #FEF3C7;
      --warning-text: #92400E;

      --shadow-sm: 0 1px 3px rgba(30, 58, 138, 0.05);
      --shadow-md: 0 4px 12px rgba(30, 58, 138, 0.07);
      --shadow-lg: 0 12px 28px rgba(30, 58, 138, 0.10);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #F1F5F9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: #0F172A;
    }

    /* Top Evaluation Control Header */
    .preview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 440px;
      margin-bottom: 12px;
      padding: 4px 8px;
    }
    .preview-title-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: #1E3A8A;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2563EB;
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.5);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
    }
    .role-toggle-bar {
      display: flex;
      gap: 6px;
      background: #E2E8F0;
      padding: 3px;
      border-radius: 20px;
      border: 1px solid #CBD5E1;
    }
    .role-pill-btn {
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      border: none;
      background: transparent;
      cursor: pointer;
      transition: all 0.2s;
    }
    .role-pill-btn.active {
      background: #2563EB;
      color: #FFFFFF;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35);
    }

    /* Phone Shell */
    .phone-container {
      width: 100%;
      max-width: 420px;
      height: 860px;
      background: var(--background);
      border-radius: 44px;
      border: 10px solid #0F172A;
      box-shadow: 0 25px 60px -15px rgba(15, 23, 42, 0.25), 0 0 0 1px rgba(0, 0, 0, 0.08);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      color: var(--on-background);
    }
    .phone-container.fullscreen-mode {
      max-width: 100%;
      height: 100vh;
      border-radius: 0;
      border: none;
      box-shadow: none;
    }

    /* Android Status Bar */
    .android-status-bar {
      height: 36px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      color: var(--on-background);
      z-index: 50;
      background: var(--background);
    }
    .status-camera-notch {
      width: 10px;
      height: 10px;
      background: #0F172A;
      border-radius: 50%;
    }
    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
    }

    /* Top App Bar */
    .app-top-bar {
      background: var(--surface);
      padding: 8px 18px 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--surface-container);
      z-index: 40;
    }
    .app-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .app-logo-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-container));
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 35, 111, 0.2);
    }
    .app-brand-text h1 {
      font-size: 17px;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.1;
      letter-spacing: -0.3px;
    }
    .app-brand-text p {
      font-size: 11px;
      color: var(--on-surface-variant);
      font-weight: 600;
    }
    .top-bar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--surface-low);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: background 0.2s;
    }
    .icon-btn:hover {
      background: var(--surface-high);
    }
    .badge-count {
      position: absolute;
      top: -2px;
      right: -2px;
      min-width: 16px;
      height: 16px;
      background: var(--absent-red);
      color: white;
      border-radius: 8px;
      font-size: 9px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      border: 1.5px solid white;
    }
    .avatar-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
    }

    /* Screen Content Area */
    .screen-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--background);
      scroll-behavior: smooth;
    }
    .screen-content::-webkit-scrollbar {
      width: 4px;
    }
    .screen-content::-webkit-scrollbar-thumb {
      background: var(--surface-variant);
      border-radius: 4px;
    }

    /* Bottom Navigation Bar */
    .app-bottom-bar {
      height: 64px;
      background: var(--surface-lowest);
      border-top: 1px solid var(--surface-container);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 4px 6px 4px;
      z-index: 40;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--on-surface-variant);
      font-size: 10px;
      font-weight: 600;
      flex: 1;
      padding: 6px 0;
      transition: all 0.2s;
      position: relative;
    }
    .nav-item.active {
      color: var(--primary);
    }
    .nav-item.active .nav-icon-wrapper {
      background: var(--surface-variant);
      color: var(--primary);
    }
    .nav-icon-wrapper {
      width: 44px;
      height: 26px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .nav-icon-wrapper .material-symbols-rounded {
      font-size: 20px;
    }

    /* Cards & Containers */
    .card {
      background: var(--surface-card);
      border-radius: 18px;
      padding: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(218, 226, 253, 0.4);
      position: relative;
      overflow: hidden;
    }

    /* Typography Utilities */
    .section-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--on-surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .section-subtitle {
      font-size: 12px;
      color: var(--on-surface-variant);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-primary {
      background: var(--primary);
      color: var(--on-primary);
      box-shadow: 0 4px 14px rgba(0, 35, 111, 0.25);
    }
    .btn-primary:hover {
      background: #001A54;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: var(--surface-high);
      color: var(--primary);
    }
    .btn-secondary:hover {
      background: var(--surface-variant);
    }
    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--outline-variant);
      color: var(--on-surface);
    }
    .btn-danger {
      background: var(--absent-bg);
      color: var(--absent-text);
      border: 1px solid rgba(220, 38, 38, 0.2);
    }
    .btn-teal {
      background: var(--secondary-container);
      color: var(--secondary);
    }
    .btn-sm {
      padding: 6px 12px;
      font-size: 11px;
      border-radius: 9px;
    }

    /* Status Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
    }
    .badge-excellent { background: var(--present-bg); color: var(--present-text); }
    .badge-good { background: #E0F2FE; color: #0369A1; }
    .badge-warning { background: var(--warning-bg); color: var(--warning-text); }
    .badge-critical { background: var(--absent-bg); color: var(--absent-text); }
    .badge-special { background: var(--secondary-container); color: var(--secondary); }
    .badge-pending { background: var(--warning-bg); color: var(--warning-text); }

    /* Donut Progress Ring */
    .donut-wrapper {
      position: relative;
      width: 86px;
      height: 86px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .donut-svg {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }
    .donut-circle-bg {
      fill: none;
      stroke: var(--surface-high);
      stroke-width: 8;
    }
    .donut-circle-val {
      fill: none;
      stroke: var(--primary);
      stroke-width: 8;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.8s ease;
    }
    .donut-label {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .donut-label .pct {
      font-size: 16px;
      font-weight: 800;
      color: var(--primary);
    }
    .donut-label .sub {
      font-size: 8px;
      font-weight: 700;
      color: var(--on-surface-variant);
      margin-top: 2px;
    }

    /* Quick Operations Grid */
    .quick-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .quick-card {
      background: var(--surface-card);
      border-radius: 16px;
      padding: 14px;
      border: 1px solid var(--surface-container);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .quick-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .quick-icon-box {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      margin-bottom: 2px;
    }
    .quick-card h4 {
      font-size: 13px;
      font-weight: 700;
      color: var(--on-surface);
    }
    .quick-card p {
      font-size: 11px;
      color: var(--on-surface-variant);
      line-height: 1.2;
    }

    /* Weekly Bar Chart */
    .chart-container {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      height: 120px;
      padding-top: 10px;
    }
    .chart-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      height: 100%;
      justify-content: flex-end;
      gap: 4px;
    }
    .chart-val {
      font-size: 10px;
      font-weight: 700;
      color: var(--on-surface-variant);
    }
    .chart-bar {
      width: 20px;
      border-radius: 6px 6px 0 0;
      background: var(--primary-container);
      transition: height 0.6s ease;
    }
    .chart-bar.highlight {
      background: var(--present-green);
    }
    .chart-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--on-surface-variant);
      margin-top: 2px;
    }

    /* Shortage Item */
    .risk-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      background: var(--surface-low);
      border-radius: 14px;
      border-left: 4px solid var(--absent-red);
      margin-bottom: 8px;
      transition: background 0.15s;
    }
    .risk-item:hover {
      background: var(--surface-high);
    }

    /* Search & Filter Bar */
    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface-card);
      padding: 10px 14px;
      border-radius: 14px;
      border: 1px solid var(--surface-container);
      box-shadow: var(--shadow-sm);
    }
    .search-box input {
      border: none;
      outline: none;
      background: transparent;
      width: 100%;
      font-size: 13px;
      color: var(--on-surface);
    }
    .filter-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .filter-chips::-webkit-scrollbar {
      display: none;
    }
    .chip {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      background: var(--surface-card);
      border: 1px solid var(--surface-container);
      color: var(--on-surface-variant);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .chip.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Student Card */
    .student-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: var(--surface-card);
      border-radius: 16px;
      border: 1px solid var(--surface-container);
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .student-card:hover {
      box-shadow: var(--shadow-md);
      border-color: var(--surface-variant);
    }
    .student-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .student-avatar {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--primary-container);
      color: white;
      font-weight: 800;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .student-meta h4 {
      font-size: 14px;
      font-weight: 700;
      color: var(--on-surface);
    }
    .student-meta p {
      font-size: 11px;
      color: var(--on-surface-variant);
      font-weight: 500;
    }

    /* Attendance Marking Item */
    .mark-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--surface-card);
      border-radius: 14px;
      border: 1px solid var(--surface-container);
      margin-bottom: 8px;
    }
    .toggle-attendance-group {
      display: flex;
      background: var(--surface-low);
      border-radius: 10px;
      padding: 2px;
      gap: 2px;
    }
    .toggle-att-btn {
      padding: 5px 12px;
      border-radius: 8px;
      border: none;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
      transition: all 0.15s;
    }
    .toggle-att-btn.present.active {
      background: var(--present-green);
      color: white;
      box-shadow: 0 2px 6px rgba(22, 163, 74, 0.3);
    }
    .toggle-att-btn.absent.active {
      background: var(--absent-red);
      color: white;
      box-shadow: 0 2px 6px rgba(220, 38, 38, 0.3);
    }
    .toggle-att-btn:not(.active) {
      background: transparent;
      color: var(--on-surface-variant);
      opacity: 0.6;
    }

    /* Floating Action Button */
    .fab-btn {
      position: absolute;
      bottom: 78px;
      right: 18px;
      width: 54px;
      height: 54px;
      border-radius: 18px;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(0, 35, 111, 0.35);
      border: none;
      cursor: pointer;
      z-index: 30;
      transition: transform 0.2s;
    }
    .fab-btn:hover {
      transform: scale(1.06);
    }

    /* Form Styles */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 12px;
    }
    .form-group label {
      font-size: 11px;
      font-weight: 700;
      color: var(--on-surface);
    }
    .form-control {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1.5px solid var(--outline-variant);
      background: var(--surface-card);
      font-size: 13px;
      color: var(--on-surface);
      outline: none;
      transition: border 0.2s;
    }
    .form-control:focus {
      border-color: var(--primary);
    }
    select.form-control {
      cursor: pointer;
    }

    /* Toast Snackbar */
    .toast-snackbar {
      position: absolute;
      bottom: 74px;
      left: 16px;
      right: 16px;
      background: #1E293B;
      color: white;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: var(--shadow-lg);
      z-index: 100;
      animation: slideUp 0.3s ease;
      display: none;
    }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* Modal dialog */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 90;
    }
    /* Motion Splash Screen Styles */
    .splash-container {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 50%, #EFF6FF 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      z-index: 80;
      color: #0F172A;
      text-align: center;
    }
    .splash-logo-box {
      width: 90px;
      height: 90px;
      border-radius: 26px;
      background: linear-gradient(135deg, #1E3A8A 0%, #2563EB 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      box-shadow: 0 12px 32px rgba(37, 99, 235, 0.35);
      margin-bottom: 24px;
      animation: splashLogoMotion 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes splashLogoMotion {
      0% { opacity: 0; transform: scale(0.5); }
      70% { opacity: 1; transform: scale(1.08); }
      100% { opacity: 1; transform: scale(1.0); }
    }
    .splash-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #1E3A8A;
      margin-bottom: 6px;
      animation: splashFadeIn 0.8s ease 0.3s forwards;
      opacity: 0;
    }
    .splash-subtitle {
      font-size: 15px;
      font-weight: 600;
      color: #0D9488;
      margin-bottom: 12px;
      animation: splashFadeIn 0.8s ease 0.5s forwards;
      opacity: 0;
    }
    .splash-tagline {
      font-size: 13px;
      color: #64748B;
      max-width: 260px;
      line-height: 1.4;
      animation: splashFadeIn 0.8s ease 0.7s forwards;
      opacity: 0;
    }
    .splash-pulse-dots {
      display: flex;
      gap: 8px;

    // Dynamic Calculation with Special Cases & New Student 0-Record Fix
    function getStudentStats(studentId) {
      const student = state.students.find(s => s.id === studentId);
      if (!student) return null;
      const studentRecords = state.records.filter(r => r.studentId === studentId);
      const total = studentRecords.length;
      
      // Special Cases (OD, MEDICAL, SPORTS, EXAM, LEAVE) count as Attended
      const attended = studentRecords.filter(r => 
        r.status === "PRESENT" || ["OD", "MEDICAL", "SPORTS", "EXAM", "LEAVE"].includes(r.type)
      ).length;
      const specialCount = studentRecords.filter(r => r.type && r.type !== "REGULAR" && r.type !== "CORRECTION").length;
      const missed = total - attended;

      // CRITICAL FIX: If total == 0, percentage is null (No attendance recorded) NOT 100%
      const percentage = total > 0 ? (attended / total) * 100 : null;

      let tier = "GOOD";
      if (percentage === null) tier = "NO_RECORDS";
      else if (percentage >= 90) tier = "EXCELLENT";
      else if (percentage >= 75) tier = "GOOD";
      else if (percentage >= 65) tier = "WARNING";
      else tier = "CRITICAL";

      return { student, total, attended, missed, specialCount, percentage, tier };
    }

    function getAllStudentsWithStats() {
      return state.students.map(s => getStudentStats(s.id));

    function handleLoginSubmit() {
      const usernameInput = document.getElementById('login-username');
      const passwordInput = document.getElementById('login-password');
      const errorBox = document.getElementById('login-error-banner');
      const errorText = document.getElementById('login-error-text');
      const submitBtn = document.getElementById('btn-login-submit');
      const submitText = document.getElementById('login-submit-text');
      const spinner = document.getElementById('login-spinner');
      const keyIcon = document.getElementById('login-key-icon');

      const username = usernameInput ? usernameInput.value.trim() : '';
      const password = passwordInput ? passwordInput.value.trim() : '';

      if (errorBox) errorBox.style.display = 'none';

      if (!username) {
        if (errorText) errorText.innerText = 'Username or Email is required.';
        if (errorBox) errorBox.style.display = 'flex';
        if (usernameInput) usernameInput.focus();
        return;
      }

      if (!password) {
        if (errorText) errorText.innerText = 'Password is required.';
        if (errorBox) errorBox.style.display = 'flex';
        if (passwordInput) passwordInput.focus();
        return;
      }

      // Show loading indicator

      if (spinner) spinner.style.display = 'inline-block';
      if (keyIcon) keyIcon.style.display = 'none';
      if (submitText) submitText.innerText = 'Verifying Database Credentials...';

      setTimeout(() => {
        const users = getStoredUsers();
        const matchedUser = users.find(u => 
          (u.email.toLowerCase() === username.toLowerCase() || (u.username && u.username.toLowerCase() === username.toLowerCase())) &&
          (u.passwordHash === password || u.password === password)
        );

        if (!matchedUser) {
          if (submitBtn) submitBtn.disabled = false;
          if (spinner) spinner.style.display = 'none';
          if (keyIcon) keyIcon.style.display = 'inline-block';
          if (submitText) submitText.innerText = 'LOGIN';
          if (errorText) errorText.innerText = 'Invalid email or password.';
          if (errorBox) errorBox.style.display = 'flex';
          return;
        }

        if (matchedUser.isActive === false) {
          if (submitBtn) submitBtn.disabled = false;
          if (spinner) spinner.style.display = 'none';
          if (keyIcon) keyIcon.style.display = 'inline-block';
          if (submitText) submitText.innerText = 'LOGIN';
          if (errorText) errorText.innerText = 'This account has been deactivated. Contact an administrator.';
          if (errorBox) errorBox.style.display = 'flex';
          return;
        }

        // Successfully Authenticated: role loaded from database record
        state.isLoggedIn = true;
        state.role = matchedUser.role;
        state.currentUserName = matchedUser.name;
        state.currentUserEmail = matchedUser.email;

        // Persist Remember Me
        const rememberCheckbox = document.getElementById('login-remember');
        if (rememberCheckbox && rememberCheckbox.checked) {
          localStorage.setItem('trackedu_remember_me', JSON.stringify({ username }));
        } else {
          localStorage.removeItem('trackedu_remember_me');
        }

        localStorage.setItem('trackedu_session', JSON.stringify({
          ...matchedUser,
          isLoggedIn: true,
          expiryTime: Date.now() + 300 * 1000
        }));
        startSessionTimer();

        const adminPill = document.getElementById('pill-admin');
        const teacherPill = document.getElementById('pill-teacher');
        if (adminPill && teacherPill) {
          adminPill.classList.toggle('active', state.role === 'ADMIN');
          teacherPill.classList.toggle('active', state.role === 'TEACHER');
        }
        const roleLabel = document.getElementById('preview-role-label');
        if (roleLabel) roleLabel.innerText = `TrackEdu (${state.role} Portal)`;
        const avatarBtn = document.getElementById('topbar-avatar');
        if (avatarBtn) avatarBtn.innerText = state.role === 'ADMIN' ? 'PS' : 'AR';

        showToast(`Welcome back, ${matchedUser.name} (${matchedUser.role})!`);
        navigateTo('DASHBOARD');
      }, 350);

            <div class="section-title" style="margin-bottom: 2px;">${isAdmin ? 'Admin Approval Center' : 'Teacher Request Center'}</div>

          ${!isAdmin ? `

          ` : ''}
        </div>

        <div>
          ${requests.map(req => {
            const isPending = req.status === 'PENDING';
            return `
              <div class="card" style="margin-bottom: 10px; box-shadow: var(--shadow-sm);">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">

                    ${req.type === 'ADD_STUDENT' ? 'Student Registration' : (req.type === 'SPECIAL_ATTENDANCE' ? `Special Attendance (${req.category || 'OD'})` : 'Attendance Correction')}
                  </span>
                  <span class="badge ${req.status === 'APPROVED' ? 'badge-excellent' : (req.status === 'REJECTED' ? 'badge-critical' : 'badge-pending')}">
                    ${req.status}
                  </span>
                </div>

                <div style="font-size: 13px; font-weight: 800; color: var(--on-surface);">${req.studentName} (${req.studentRollNumber})</div>
                <div style="font-size: 11px; color: var(--on-surface-variant); margin-top: 2px;">Submitted by: <b>${req.submittedBy}</b></div>
                <div style="font-size: 12px; color: var(--on-surface); background: var(--surface-low); padding: 8px 10px; border-radius: 8px; margin-top: 6px;">
                  Reason: ${req.reason}
                </div>

                ${isAdmin && isPending ? `
                  <div style="display: flex; gap: 8px; margin-top: 10px;">
                    <button class="btn btn-danger btn-sm" style="flex: 1;" onclick="rejectRequest(${req.id})">
                      <span class="material-symbols-rounded">close</span>
                      <span>Reject</span>
                    </button>
                    <button class="btn btn-primary btn-sm" style="flex: 1;" onclick="approveRequest(${req.id})">
                      <span class="material-symbols-rounded">check</span>
                      <span>Approve</span>
                    </button>
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function approveRequest(id) {
      const req = state.requests.find(r => r.id === id);
      if (!req) return;
      req.status = 'APPROVED';

      if (req.type === 'ADD_STUDENT') {
        const newStudent = {
          id: Date.now(),
          name: req.studentName,
          rollNumber: req.studentRollNumber,
          department: req.department,
          year: req.year,
          section: req.section,
          email: req.email,
          phone: req.phone,
          parentName: req.parentName || "Guardian",
          parentPhone: req.parentPhone || "+91 98000 11122",
          avatarInitials: req.studentName.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase()
        };
        state.students.push(newStudent);
      } else if (req.type === 'ATTENDANCE_CORRECTION' && req.studentId) {
        state.records.push({
          id: Date.now(),
          studentId: req.studentId,
          date: req.date,
          status: req.requestedStatus || "PRESENT",
          type: req.requestedType || "REGULAR",
          subject: req.subject,
          period: "Period 2 (10:15 AM - 11:15 AM)",
          note: `Approved correction: ${req.reason}`,
          createdBy: "Admin"
        });
      } else if (req.type === 'SPECIAL_ATTENDANCE' && req.studentId) {
        state.records.push({
          id: Date.now(),
          studentId: req.studentId,
          date: req.date,
          status: "PRESENT",
          type: req.category || "OD",
          subject: req.subject || "CS502 - Database Systems",
          period: "Period 2 (10:15 AM - 11:15 AM)",
          note: `Approved Special (${req.category || 'OD'}): ${req.reason}`,
          createdBy: "Admin"
        });
      }

      state.notifications.unshift({
        id: Date.now(),
        title: "Request Approved",
        message: `Request for ${req.studentName} (${req.studentRollNumber}) was approved by Administrator.`,
        category: "REQUESTS",
        isRead: false
      });

      saveState();
      showToast(`Request #${id} approved successfully`);
      renderRequestsScreen(document.getElementById('screen-content'));
    }

    function rejectRequest(id) {
      const req = state.requests.find(r => r.id === id);
      if (!req) return;
      req.status = 'REJECTED';
      saveState();
      showToast(`Request #${id} rejected`);
      renderRequestsScreen(document.getElementById('screen-content'));
    }

              <div style="display: flex; justify-content: space-between; align-items: center;">

    function handleNotificationClick(id, target) {
      const notif = state.notifications.find(n => n.id === id);

      renderMarkAttendance(document.getElementById('screen-content'));

    function markAllPresent() {
      state.students.forEach(s => state.activeSessionDraft[s.id] = 'PRESENT');

      renderMarkAttendance(document.getElementById('screen-content'));

    function saveActiveAttendance() {
      const date = state.selectedDate;
      const subject = state.selectedSubject;
      state.records = state.records.filter(r => r.date !== date);

      state.students.forEach(student => {
        const status = state.activeSessionDraft[student.id] || "PRESENT";
        state.records.push({
          id: Date.now() + Math.random(),
          studentId: student.id,
          date: date,
          status: status,
          type: "REGULAR",
          subject: subject,
          period: "Period 2 (10:15 AM - 11:15 AM)",
          note: status === "ABSENT" ? "Recorded unexcused absence" : "Verified regular roll call",
          createdBy: state.currentUserName
        });
      });

      saveState();
      showToast(`Saved! Attendance session stored into SQLite`);
    }

            Dispatch compliance SMS alert to parents of all <b>${warningCount + criticalCount} students</b> under ${state.mandatoryThreshold}%.
          </p>
          <button class="btn btn-primary" style="width: 100%;" onclick="showToast('Dispatched SMS compliance notice to ${warningCount + criticalCount} guardians')">
            <span class="material-symbols-rounded">send</span>
            <span>Dispatch Batch SMS Notices</span>
          </button>
        </div>
      `;
    }

    // Settings Screen (Role-Aware)
    function renderSettings(container) {
      const isAdmin = state.role === 'ADMIN';
      container.innerHTML = `
        <div class="card">
          <div class="section-title">Active User Session</div>
          <div style="display: flex; align-items: center; gap: 12px; margin-top: 8px;">
            <div class="student-avatar" style="width: 46px; height: 46px; font-size: 16px;">${isAdmin ? 'PS' : 'AR'}</div>
            <div>
              <div style="font-size: 14px; font-weight: 700; color: var(--on-surface);">${state.currentUserName}</div>
              <div style="font-size: 12px; color: var(--on-surface-variant);">${state.currentUserEmail}</div>
              <span class="badge ${isAdmin ? 'badge-good' : 'badge-special'}" style="font-size: 10px; margin-top: 4px;">Role: ${state.role}</span>
            </div>
          </div>
          <button class="btn btn-outline" style="width: 100%; margin-top: 14px; color: var(--absent-red); border: 1.5px solid #FFDAD6; background: #FFF5F5; font-weight: 700;" onclick="showLogoutConfirmModal()">
            <span class="material-symbols-rounded">logout</span>
            <span>Sign Out of TrackEdu</span>
          </button>
        </div>

        <!-- Appearance Mode Selector (3 Segments) -->
        <div class="card">
          <div class="section-title">Theme & Appearance</div>
          <div style="font-size: 11px; color: var(--on-surface-variant); margin-top: 2px; margin-bottom: 10px;">
            Choose system default or switch between Stitch White Light and Sleek Dark modes.
          </div>
          <div class="theme-segment-bar">
            <button class="theme-segment-chip ${state.themeMode === 'LIGHT' ? 'active' : ''}" id="settings-theme-light" onclick="setTheme('LIGHT')">
              <span class="material-symbols-rounded" style="font-size: 16px;">light_mode</span>
              <span>Light</span>
            </button>
            <button class="theme-segment-chip ${state.themeMode === 'DARK' ? 'active' : ''}" id="settings-theme-dark" onclick="setTheme('DARK')">
              <span class="material-symbols-rounded" style="font-size: 16px;">dark_mode</span>
              <span>Dark</span>
            </button>
            <button class="theme-segment-chip ${state.themeMode === 'SYSTEM' ? 'active' : ''}" id="settings-theme-system" onclick="setTheme('SYSTEM')">
              <span class="material-symbols-rounded" style="font-size: 16px;">devices</span>
              <span>System</span>
            </button>
          </div>
        </div>

        <!-- Authentication Session & Security Card (5-Minute Absolute Timeout) -->
        <div class="card" style="border-left: 4px solid var(--secondary);">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div class="section-title" style="margin-bottom: 0;">Authentication Session & Security</div>
            <span class="badge badge-good" style="font-size: 10px;">Active</span>
          </div>
          <div style="background: var(--surface-low); border-radius: 12px; padding: 12px; margin-top: 10px; display: flex; align-items: center; justify-content: space-between;">
            <div>
              <div style="font-size: 11px; font-weight: 700; color: var(--on-surface-variant);">AUTO-LOGOUT COUNTDOWN</div>
              <div style="font-size: 10px; color: var(--outline); margin-top: 1px;">Strict 5-minute absolute lifetime</div>
            </div>
            <div id="settings-session-countdown" style="font-size: 20px; font-weight: 800; font-family: monospace; color: var(--primary);">
              04:59
            </div>
          </div>
          <p style="font-size: 11px; color: var(--on-surface-variant); margin-top: 8px; line-height: 1.4;">
            For statutory student privacy, your session automatically expires after 5 minutes. User activity or navigation does not extend this window.
          </p>
          <button class="btn btn-secondary btn-sm" style="width: 100%; margin-top: 10px; font-weight: 700;" onclick="triggerSessionExpiry()">
            <span class="material-symbols-rounded" style="font-size: 16px;">alarm_off</span>
            <span>Simulate 5-Min Session Expiry (QA Test)</span>
          </button>
        </div>

        ${isAdmin ? `
          <div class="card">
            <div class="section-title">Attendance Threshold Regulation</div>
            <div class="form-group" style="margin-top: 8px;">
              <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700;">
                <span>Statutory Mandatory Bar</span>
                <span>${state.mandatoryThreshold}%</span>
              </div>
              <input type="range" min="60" max="85" value="${state.mandatoryThreshold}" style="width: 100%; margin-top: 6px;" oninput="state.mandatoryThreshold = parseInt(this.value); this.previousElementSibling.lastElementChild.innerText = this.value + '%';" />
            </div>
          </div>

          <div class="card">
            <div class="section-title">Database Administration</div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
              <button class="btn btn-secondary btn-sm" onclick="showToast('Attendance query cache cleared')">
                <span class="material-symbols-rounded">cleaning_services</span>
                <span>Clear Cache</span>
              </button>
              <button class="btn btn-danger btn-sm" onclick="resetDatabase()">
                <span class="material-symbols-rounded">restart_alt</span>
                <span>Format SQLite Database</span>
              </button>
            </div>
          </div>
        ` : `
          <div class="card">
            <div class="section-title">Teacher Permissions</div>
            <p style="font-size: 12px; color: var(--on-surface-variant);">
              You are logged in with Teacher permissions. Destructive database operations are restricted to Department Administrators.
            </p>
          </div>
        `}
      `;
    }

    function resetDatabase() {
      localStorage.clear();
      state.students = [...initialStudents];
      state.records = generateInitialRecords();
      state.requests = [...initialRequests];
      state.notifications = [...initialNotifications];
      saveState();
      showToast('Database formatted & restored');
      renderScreen();
    }

    // UI Feedback Helpers
    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast-snackbar');
      const text = document.getElementById('toast-text');
      text.innerText = msg;
      toast.style.background = isError ? 'var(--absent-red)' : '#1E293B';
      toast.style.display = 'flex';
      setTimeout(() => { hideToast(); }, 3500);
    }
    function hideToast() {
      document.getElementById('toast-snackbar').style.display = 'none';
    }
    function showModal(contentHtml) {
      const overlay = document.getElementById('modal-overlay');
      const box = document.getElementById('modal-box');
      box.innerHTML = contentHtml;
      overlay.style.display = 'flex';
    }
    function hideModal() {
      document.getElementById('modal-overlay').style.display = 'none';
    }

    setInterval(() => {
      const now = new Date();
      const hrs = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      const clockEl = document.getElementById('live-clock');
      if (clockEl) clockEl.innerText = `${hrs}:${mins}`;
    }, 1000);

    
    // --- Appearance & Theme Engine ---
    function setTheme(mode) {
      state.themeMode = mode;
      localStorage.setItem('trackedu_theme_mode', mode);

      let isDark = false;
      if (mode === 'DARK') isDark = true;
      else if (mode === 'SYSTEM') isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      else isDark = false;

      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      document.body.classList.toggle('dark-mode', isDark);

      ['drawer-theme', 'settings-theme'].forEach(prefix => {
        const l = document.getElementById(`${prefix}-light`);
        const d = document.getElementById(`${prefix}-dark`);
        const s = document.getElementById(`${prefix}-system`);
        if (l) l.classList.toggle('active', mode === 'LIGHT');
        if (d) d.classList.toggle('active', mode === 'DARK');
        if (s) s.classList.toggle('active', mode === 'SYSTEM');
      });

      showToast(`Appearance: ${mode.charAt(0) + mode.slice(1).toLowerCase()} Mode`);
    }

    // Initialize Theme
    const savedTheme = localStorage.getItem('trackedu_theme_mode') || 'LIGHT';
    if (savedTheme === 'DARK' || (savedTheme === 'SYSTEM' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
      document.body.classList.add('dark-mode');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
      document.body.classList.remove('dark-mode');
    }

    // --- Navigation Drawer Functions ---
    function openDrawer() {
      const overlay = document.getElementById('drawer-overlay');
      const avatar = document.getElementById('drawer-avatar');
      const name = document.getElementById('drawer-user-name');
      const email = document.getElementById('drawer-user-email');
      const roleBadge = document.getElementById('drawer-role-badge');
      
      if (avatar) avatar.innerText = state.role === 'ADMIN' ? 'PS' : 'AR';
      if (name) name.innerText = state.currentUserName;
      if (email) email.innerText = state.currentUserEmail;
      if (roleBadge) {
        roleBadge.innerText = state.role;
        roleBadge.className = `badge ${state.role === 'ADMIN' ? 'badge-good' : 'badge-special'}`;
      }
      
      if (overlay) overlay.classList.add('open');
    }

    function closeDrawer() {
      const overlay = document.getElementById('drawer-overlay');
      if (overlay) overlay.classList.remove('open');
    }

    function handleDrawerBackdropClick(e) {
      if (e.target.id === 'drawer-overlay') {
        closeDrawer();
      }
    }

    function drawerNavigate(screen) {
      closeDrawer();
      navigateTo(screen);
    }

    // --- Absolute 5-Minute Session Expiry Engine ---
    let sessionRemainingSeconds = 300;
    let sessionTimerInterval = null;

    function startSessionTimer() {
      if (sessionTimerInterval) clearInterval(sessionTimerInterval);
      
      const session = JSON.parse(localStorage.getItem('trackedu_session'));
      if (session && session.isLoggedIn) {
        if (!session.expiryTime) {
          session.expiryTime = Date.now() + 300 * 1000;
          localStorage.setItem('trackedu_session', JSON.stringify(session));
        }
      }

      sessionTimerInterval = setInterval(() => {
        if (!state.isLoggedIn) return;
        const curSession = JSON.parse(localStorage.getItem('trackedu_session'));
        if (!curSession || !curSession.expiryTime) return;

        const diff = Math.max(0, Math.floor((curSession.expiryTime - Date.now()) / 1000));
        sessionRemainingSeconds = diff;

        const countdownEl = document.getElementById('settings-session-countdown');
        if (countdownEl) {
          const mins = String(Math.floor(sessionRemainingSeconds / 60)).padStart(2, '0');
          const secs = String(sessionRemainingSeconds % 60).padStart(2, '0');
          countdownEl.innerText = `${mins}:${secs}`;
        }

        if (sessionRemainingSeconds <= 0) {
          triggerSessionExpiry();
        }
      }, 1000);
    }

    function triggerSessionExpiry() {
      state.isLoggedIn = false;
      localStorage.removeItem('trackedu_session');
      showModal(`
        <div style="text-align: center; padding: 10px 4px;">
          <div style="width: 52px; height: 52px; border-radius: 50%; background: #FFDAD6; color: var(--absent-red); display: flex; align-items: center; justify-content: center; margin: 0 auto 12px auto;">
            <span class="material-symbols-rounded" style="font-size: 30px;">timer_off</span>
          </div>
          <div style="font-size: 16px; font-weight: 800; color: var(--on-surface); margin-bottom: 6px;">Session Expired</div>
          <p style="font-size: 12px; color: var(--on-surface-variant); line-height: 1.5; margin-bottom: 16px;">
            For statutory student privacy and security compliance, your session has timed out after 5 minutes of absolute lifetime.
          </p>
          <button class="btn btn-primary" style="width: 100%; height: 44px; font-weight: 800;" onclick="hideModal(); navigateTo('LOGIN');">
            <span class="material-symbols-rounded">login</span>
            <span>Return to Sign In</span>
          </button>
        </div>
      `);
    }

    // Hook session timer to login success

    startSessionTimer();
    navigateTo('SPLASH');
  </script>
</body>
</html>
